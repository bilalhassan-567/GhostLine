[project]
name = "ghostline"
version = "0.1.0"
description = "Phone-powered data-verification engine — calls the numbers on your records, extracts evidence-backed verdicts, exports a corrections file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "calle-ai>=0.7.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "anthropic>=0.40",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
ghostline = "ghostline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# The skill scripts are standalone, stdlib-only, and must stay portable to older Pythons.
"skills/**/scripts/*.py" = ["E402", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
