<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ghostline{% endblock %}</title>
<style>
  :root{
    --bg:#0b0d12; --bg-2:#0f1219; --panel:#141822; --panel-2:#1a1f2b;
    --line:#252b39; --line-2:#333b4d;
    --ink:#eef1f6; --ink-2:#aeb6c6; --ink-3:#7b8496;
    --brand:#4fd1a5; --brand-ink:#06231a;
    --accent:#7aa2ff;
    --match:#3fbf78; --mismatch:#e5615a; --unclear:#e6ae4a; --nocontact:#8a93a6;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 40px -20px rgba(0,0,0,.7);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 500px at 80% -8%, rgba(79,209,165,.10), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(122,162,255,.07), transparent 55%),
      var(--bg);
    color:var(--ink); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
    letter-spacing:.005em;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:rgba(79,209,165,.28)}

  .wrap{max-width:1000px;margin:0 auto;padding:26px 22px 90px}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:-.01em}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--brand);
    box-shadow:0 0 0 4px rgba(79,209,165,.16), 0 0 18px rgba(79,209,165,.5)}
  .topbar nav{display:flex;gap:18px;font-size:13.5px;color:var(--ink-2)}
  .topbar nav a{color:var(--ink-2)}
  .topbar nav a:hover{color:var(--ink)}

  /* hero */
  .hero h1{font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.02em;font-weight:750;
    max-width:20ch}
  .hero .lede{color:var(--ink-2);font-size:clamp(15px,1.7vw,18px);margin-top:14px;max-width:60ch}
  .lifecycle{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:22px;
    font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .lifecycle span{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .lifecycle span.on{color:var(--brand);border-color:rgba(79,209,165,.35);background:rgba(79,209,165,.08)}
  .lifecycle i{color:var(--line-2);font-style:normal}

  /* panels */
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;margin:18px 0;box-shadow:var(--shadow)}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);
    margin-bottom:14px;font-weight:700}
  .panel .sub{color:var(--ink-3);font-size:13px;margin-top:-6px;margin-bottom:14px}

  /* stat strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .stats div{background:var(--panel);padding:16px 18px}
  .stats .n{font:700 22px/1 var(--mono);letter-spacing:-.01em}
  .stats .k{color:var(--ink-3);font-size:12px;margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
  .stats .brand{color:var(--brand)}

  /* forms */
  label{display:block;font-size:12px;color:var(--ink-3);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
  input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);
    border-radius:var(--radius-sm);padding:10px 12px;font:14px/1.5 var(--sans)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(79,209,165,.15)}
  input[type=file]{padding:9px;color:var(--ink-2)}
  textarea{resize:vertical;min-height:74px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:170px}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);
    border:0;border-radius:var(--radius-sm);padding:11px 18px;font:600 14px/1 var(--sans);cursor:pointer;
    transition:transform .06s ease, filter .15s ease}
  .btn:hover{filter:brightness(1.07);text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.sm{padding:8px 13px;font-size:13px}

  .muted{color:var(--ink-3);font-size:13px}
  code{font:12.5px/1.4 var(--mono);background:var(--bg-2);border:1px solid var(--line);
    padding:1px 6px;border-radius:5px}

  /* verdict chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--mono);letter-spacing:.06em;
    padding:5px 9px;border-radius:6px;text-transform:uppercase}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.match{background:rgba(63,191,120,.13);color:var(--match)}
  .chip.mismatch{background:rgba(229,97,90,.13);color:var(--mismatch)}
  .chip.unclear{background:rgba(230,174,74,.13);color:var(--unclear)}
  .chip.nocontact{background:rgba(138,147,166,.13);color:var(--nocontact)}

  /* result cards */
  .rec{border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden;background:var(--panel)}
  .rec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:15px 18px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .rec>header .name{font-weight:650;font-size:15px}
  .rec>header .meta{font:12px/1.4 var(--mono);color:var(--ink-3)}
  .rec .body{padding:6px 18px 16px}
  .claim{padding:14px 0;border-bottom:1px solid var(--line)}
  .claim:last-child{border-bottom:0}
  .claim .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .claim .cid{font:12px/1 var(--mono);color:var(--ink-2)}
  .evidence{border-left:2px solid var(--brand);background:var(--bg-2);border-radius:0 8px 8px 0;
    padding:9px 13px;margin:9px 0;font-size:14px}
  .evidence.c-high{border-left-color:var(--match)}
  .evidence.c-medium{border-left-color:var(--unclear)}
  .evidence.c-low{border-left-color:var(--nocontact)}
  .evidence .q{color:var(--ink)}
  .evidence .src{color:var(--ink-3);font:11px/1 var(--mono);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
  .reason{color:var(--ink-2);font-size:13px;margin-top:7px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font:10px/1 var(--mono);letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);
    padding:4px 6px;border-radius:5px;text-transform:uppercase}
  .contrast{margin-top:8px;font-size:12px;color:var(--ink-3)}
  .contrast b{color:var(--unclear)}

  /* transcript — chat style */
  details.transcript{margin-top:12px}
  details.transcript>summary{cursor:pointer;color:var(--ink-3);font-size:12.5px;
    text-transform:uppercase;letter-spacing:.06em;list-style:none}
  details.transcript>summary::-webkit-details-marker{display:none}
  details.transcript>summary::before{content:"▸ ";color:var(--line-2)}
  details.transcript[open]>summary::before{content:"▾ "}
  .turns{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .turn{max-width:80%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5}
  .turn.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .turn.user{align-self:flex-end;background:rgba(122,162,255,.10);border:1px solid rgba(122,162,255,.25);
    border-bottom-right-radius:4px}
  .turn.unknown{align-self:center;background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-size:12px}
  .turn mark{background:rgba(79,209,165,.28);color:inherit;border-radius:3px;padding:0 3px}
  .turn .t{font:10px/1 var(--mono);color:var(--ink-3);margin-top:5px;text-transform:uppercase}

  /* scenario grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .scn{display:block;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;
    background:var(--panel);transition:border-color .15s ease}
  .scn:hover{border-color:var(--brand);text-decoration:none}
  .scn .v{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .scn .d{color:var(--ink-2);font-size:13px;margin-top:7px}

  .banner{border:1px solid rgba(230,174,74,.3);background:rgba(230,174,74,.08);color:var(--unclear);
    border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin:14px 0}
  .divider{height:1px;background:var(--line);margin:22px 0}
  footer{margin-top:44px;color:var(--ink-3);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:18px}

  @media (max-width:560px){
    .turn{max-width:92%}
    .topbar nav{gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Ghostline
      <span class="chip {{ 'match' if app_mode()=='live' else 'nocontact' }}"
        style="margin-left:8px;font-size:9.5px">{{ app_mode() }} mode</span></div>
    <nav>
      <a href="/">Verify</a>
      <a href="/replay">Scenarios</a>
      <a href="/packs">Claim packs</a>
      <a href="https://github.com/bilalhassan-567/GhostLine" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
  {% block body %}{% endblock %}
  <footer>
    <span>Ghostline &mdash; it doesn't claim truth, it records what a source said.</span>
    <a href="/health">status</a>
  </footer>
</div>
{% block script %}{% endblock %}
</body>
</html>
