<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ghostline{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090b; --bg-1:#0d0d10; --bg-2:#141418; --bg-3:#1b1b20;
    --edge:#232329; --edge-soft:#1a1a1e;
    --fg:#fafafa; --fg-2:#a1a1ab; --fg-3:#63636d; --fg-4:#3f3f47;
    --paper:#e9e4d8;                 /* wordmark / hairline accents — deliberately not a "brand color" */
    --live:#2dd4bf;
    --match:#5aa27f; --mismatch:#c9605a; --unclear:#caa04a; --nocontact:#71717a;
    --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:400 15px/1.6 var(--sans); letter-spacing:-0.006em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  a{color:inherit; text-decoration:none}
  a:hover{color:var(--fg)}
  ::selection{background:rgba(45,212,191,.25)}
  h1,h2,h3{font-weight:600; letter-spacing:-0.022em; line-height:1.15}
  b,strong{font-weight:600}
  code,kbd{font:400 12.5px/1.4 var(--mono); background:var(--bg-2); border:1px solid var(--edge-soft);
    padding:1.5px 5px; border-radius:4px; color:var(--fg-2)}

  /* ---- shell ---- */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(9,9,11,.82);
    backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--edge)}
  .topbar .inner{max-width:1080px; margin:0 auto; padding:0 24px; height:54px;
    display:flex; align-items:center; justify-content:space-between}
  .mark{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-0.02em; font-size:15px}
  .mark .glyph{width:9px; height:9px; border-radius:2px; background:var(--paper);
    box-shadow:0 0 0 3px rgba(233,228,216,.10)}
  .mark .glyph.live{background:var(--live); box-shadow:0 0 0 3px rgba(45,212,191,.14); animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  nav.tabs{display:flex; gap:2px}
  nav.tabs a{padding:7px 11px; font:400 13px/1 var(--sans); color:var(--fg-3); border-radius:6px}
  nav.tabs a:hover{color:var(--fg-2); background:var(--bg-2)}
  nav.tabs a[aria-current]{color:var(--fg); background:var(--bg-2)}

  main{max-width:1080px; margin:0 auto; padding:44px 24px 120px}

  /* ---- primitives ---- */
  .eyebrow{font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--fg-3)}
  .lede{color:var(--fg-2); font-size:16px; line-height:1.65; max-width:64ch}
  .muted{color:var(--fg-3); font-size:13.5px}
  .rule{height:1px; background:var(--edge); border:0; margin:40px 0}

  .card{background:var(--bg-1); border:1px solid var(--edge); border-radius:12px}
  .card > .hd{padding:16px 20px; border-bottom:1px solid var(--edge); display:flex;
    align-items:center; justify-content:space-between; gap:12px}
  .card > .hd h2{font-size:14px; letter-spacing:-0.01em}
  .card > .bd{padding:20px}

  .btn{display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 16px;
    font:500 13.5px/1 var(--sans); border-radius:7px; cursor:pointer; border:1px solid transparent;
    transition:background .12s ease, border-color .12s ease, color .12s ease; white-space:nowrap}
  .btn.primary{background:var(--fg); color:#0a0a0a}
  .btn.primary:hover{background:#e4e4e7}
  .btn.secondary{background:transparent; border-color:var(--edge); color:var(--fg-2)}
  .btn.secondary:hover{border-color:var(--fg-4); color:var(--fg)}
  .btn.sm{height:32px; padding:0 12px; font-size:12.5px}

  label{display:block; font:500 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    color:var(--fg-3); margin:0 0 6px}
  input,select,textarea{width:100%; height:38px; background:var(--bg-2); color:var(--fg);
    border:1px solid var(--edge); border-radius:7px; padding:0 11px; font:400 14px/1.4 var(--sans);
    transition:border-color .12s ease, box-shadow .12s ease}
  textarea{height:auto; min-height:80px; padding:9px 11px; resize:vertical; line-height:1.6}
  input[type=file]{height:auto; padding:8px 10px; color:var(--fg-2); font-size:13px}
  select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='%2363636d' stroke-width='1.4' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:30px}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--live);
    box-shadow:0 0 0 3px rgba(45,212,191,.12)}
  .field-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px}

  /* ---- verdict readout ---- */
  .verdict{display:inline-flex; align-items:center; gap:8px; font:500 12px/1 var(--mono);
    letter-spacing:.10em; text-transform:uppercase}
  .verdict::before{content:""; width:9px; height:9px; border-radius:2px; background:currentColor}
  .verdict.match{color:var(--match)} .verdict.mismatch{color:var(--mismatch)}
  .verdict.unclear{color:var(--unclear)} .verdict.nocontact{color:var(--nocontact)}
  /* keep .chip as an alias so existing hooks/tests hold */
  .chip{display:inline-flex; align-items:center; gap:7px; font:500 11px/1 var(--mono);
    letter-spacing:.09em; text-transform:uppercase; padding:4px 8px; border-radius:5px; border:1px solid var(--edge)}
  .chip.match{color:var(--match)} .chip.mismatch{color:var(--mismatch)}
  .chip.unclear{color:var(--unclear)} .chip.nocontact{color:var(--nocontact)}
  .chip.match,.chip.mismatch,.chip.unclear,.chip.nocontact{border-color:currentColor; background:transparent}

  /* ---- lifecycle ---- */
  .lifecycle{display:flex; align-items:center; gap:0; margin:26px 0 4px; flex-wrap:wrap}
  .lifecycle .stage{font:500 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
    color:var(--fg-4); padding:5px 0}
  .lifecycle .stage.on{color:var(--fg-2)}
  .lifecycle .link{width:26px; height:1px; background:var(--edge); margin:0 9px}
  @media (max-width:640px){ .lifecycle .link{width:14px; margin:0 5px} }

  /* ---- record / claim ---- */
  .record{border:1px solid var(--edge); border-radius:12px; margin:14px 0; overflow:hidden; background:var(--bg-1)}
  .record > .rhd{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    flex-wrap:wrap; padding:14px 20px; background:var(--bg-2); border-bottom:1px solid var(--edge)}
  .record > .rhd .rname{font-weight:600; font-size:14.5px}
  .record > .rhd .rmeta{font:400 12px/1.4 var(--mono); color:var(--fg-3)}
  .record .rbd{padding:4px 20px 8px}
  .claim{padding:16px 0; border-bottom:1px solid var(--edge-soft)}
  .claim:last-child{border-bottom:0}
  .claim .cline{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .claim .cid{font:400 12px/1 var(--mono); color:var(--fg-3)}
  .quote{margin:11px 0 8px; padding:10px 0 10px 15px; border-left:2px solid var(--fg-4);
    font-size:15px; line-height:1.55; color:var(--fg)}
  .quote.c-high{border-left-color:var(--match)}
  .quote.c-medium{border-left-color:var(--unclear)}
  .quote.c-low{border-left-color:var(--nocontact)}
  .quote .cite{margin-top:7px; font:400 11px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3)}
  .reason{color:var(--fg-2); font-size:13.5px; line-height:1.6}
  .taglist{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
  .tg{font:400 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3);
    border:1px solid var(--edge); padding:4px 6px; border-radius:4px}
  .contrast{margin-top:10px; padding:10px 12px; border:1px solid var(--edge); border-radius:8px;
    background:var(--bg-2); font-size:12.5px; color:var(--fg-2); line-height:1.6}
  .contrast b{color:var(--unclear); font-weight:500}
  .stamp{margin-top:8px; font:400 11px/1 var(--mono); color:var(--fg-3)}

  /* ---- transcript ---- */
  details.tx{margin-top:14px; border-top:1px solid var(--edge-soft); padding-top:12px}
  details.tx > summary{cursor:pointer; font:500 11px/1 var(--mono); letter-spacing:.08em;
    text-transform:uppercase; color:var(--fg-3); list-style:none}
  details.tx > summary::-webkit-details-marker{display:none}
  details.tx > summary::before{content:"+ "; color:var(--fg-4)}
  details.tx[open] > summary::before{content:"– "}
  .tx-body{margin-top:12px}
  .tx-turn{display:grid; grid-template-columns:64px 1fr 44px; gap:12px; padding:6px 0; font-size:13.5px; line-height:1.6}
  .tx-turn .who{font:400 10px/1.6 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--fg-4); padding-top:2px}
  .tx-turn.user .who{color:var(--fg-2)}
  .tx-turn .said{color:var(--fg-2)}
  .tx-turn.user .said{color:var(--fg)}
  .tx-turn .at{font:400 10px/1.8 var(--mono); color:var(--fg-4); text-align:right}
  .tx-turn mark{background:rgba(90,162,127,.16); color:inherit; box-shadow:inset 0 -1px 0 rgba(90,162,127,.55); border-radius:2px; padding:0 1px}
  @media (max-width:640px){ .tx-turn{grid-template-columns:52px 1fr; } .tx-turn .at{display:none} }

  /* ---- callouts ---- */
  .note{border:1px solid var(--edge); border-radius:9px; padding:12px 14px; font-size:13px;
    color:var(--fg-2); line-height:1.6; margin:14px 0; background:var(--bg-1)}
  .note.act{border-color:rgba(45,212,191,.28); background:rgba(45,212,191,.05)}
  .note .h{font-weight:600; color:var(--fg); display:block; margin-bottom:3px}

  /* ---- stat row ---- */
  .stats{display:flex; flex-wrap:wrap; border:1px solid var(--edge); border-radius:10px; overflow:hidden}
  .stats > div{flex:1; min-width:130px; padding:15px 18px; border-right:1px solid var(--edge)}
  .stats > div:last-child{border-right:0}
  .stats .n{font:500 21px/1 var(--mono); letter-spacing:-0.01em}
  .stats .k{margin-top:6px; font:400 10.5px/1.4 var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--fg-3)}

  /* ---- scenario list ---- */
  .scn-list{border:1px solid var(--edge); border-radius:10px; overflow:hidden}
  .scn-row{display:grid; grid-template-columns:120px 1fr 20px; align-items:center; gap:14px;
    padding:13px 16px; border-bottom:1px solid var(--edge-soft); transition:background .12s ease}
  .scn-row:last-child{border-bottom:0}
  .scn-row:hover{background:var(--bg-2)}
  .scn-row .d{color:var(--fg-2); font-size:13.5px}
  .scn-row .arr{color:var(--fg-4); text-align:right}
  @media (max-width:640px){ .scn-row{grid-template-columns:104px 1fr; } .scn-row .arr{display:none} }

  footer{max-width:1080px; margin:0 auto; padding:0 24px 60px; color:var(--fg-4); font-size:12.5px;
    display:flex; gap:18px; flex-wrap:wrap}
</style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="mark" href="/">
      <span class="glyph{% if app_mode()=='live' %} live{% endif %}"></span> Ghostline
    </a>
    <nav class="tabs">
      <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Verify</a>
      <a href="/replay"{% if request.url.path.startswith('/replay') %} aria-current="page"{% endif %}>Scenarios</a>
      <a href="/packs"{% if request.url.path.startswith('/packs') %} aria-current="page"{% endif %}>Claim packs</a>
      <a href="https://github.com/bilalhassan-567/GhostLine" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
<footer>
  <span>Ghostline records what a source said, not what is true.</span>
  <a href="/health">status</a>
  <span>{{ app_mode() }} mode</span>
</footer>
{% block script %}{% endblock %}
</body>
</html>
