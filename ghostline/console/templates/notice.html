{% extends "base.html" %}
{% block body %}
<div class="card" style="margin-top:20px">
  <div class="hd"><h2>{{ title or "Not available" }}</h2></div>
  <div class="bd">
    <p class="lede" style="font-size:14px">{{ message }}</p>
    <p style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap">
      <a class="btn primary" href="/replay">Explore recorded scenarios &mdash; Replay Mode</a>
      <a class="btn secondary" href="/">Back</a>
    </p>
  </div>
</div>
{% endblock %}
